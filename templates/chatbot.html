<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatBot</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">
</head>
<body>

<div id="chat-container">
    <aside id="conversation-sidebar">
        <button id="new-conversation-btn" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> New conversation
        </button>
        <div id="conversation-status">Loading...</div>
        <div id="conversation-list"></div>
    </aside>

    <div id="chat-content">
        <div id="chat-box"></div>

        <div id="input-container">
            <input type="text" id="msg-input" class="form-control" placeholder="Type your message...">
            <button id="send-btn" class="btn btn-primary" title="Send">
                <i class="bi bi-send-fill"></i>
            </button>
            <button id="voice-btn" class="btn btn-success" title="Speak">
                <i class="bi bi-mic-fill"></i>
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
